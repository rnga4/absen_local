services:
  absensi-fpm:
    build: .
    container_name: absensi-fpm
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./app:/var/www/html
  absensi-nginx:
    image: nginx:alpine
    container_name: absensi-nginx
    restart: unless-stopped
    depends_on:
      - absensi-fpm
    ports:
      - "9790:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
